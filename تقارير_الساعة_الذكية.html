<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>الساعة الذكية – الابتدائية الثانية</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');

  :root {
    --ink:     #0A1628;
    --brand:   #1565C0;
    --accent:  #29B6F6;
    --glow:    #00E5FF;
    --surface: #0F1F3D;
    --card:    #132340;
    --panel:   #1A2E50;
    --muted:   #4A6080;
    --text:    #E8F1FF;
    --sub:     #7EA8D8;
    --border:  rgba(41,182,246,0.2);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    font-family: 'Cairo', sans-serif;
    background: var(--ink);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content:'';
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(21,101,192,.3) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 90%, rgba(0,229,255,.1) 0%, transparent 55%),
      var(--ink);
    pointer-events:none;
  }

  /* ── Header ── */
  .app-header {
    position: sticky; top:0; z-index:100;
    background: linear-gradient(135deg, #0D2B55, #0A1628);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 12px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .header-top {
    display: flex; align-items: center; gap: 10px; width:100%;
    justify-content: center;
  }
  .watch-icon {
    font-size: 2rem;
    filter: drop-shadow(0 0 10px var(--glow));
    animation: pulse-icon 3s ease-in-out infinite;
    flex-shrink:0;
  }
  @keyframes pulse-icon {
    0%,100% { filter: drop-shadow(0 0 10px var(--glow)); }
    50%      { filter: drop-shadow(0 0 22px var(--glow)); }
  }
  .header-titles { text-align:center; }
  .school-name { font-size:.72rem; color:var(--sub); }
  .app-title   { font-size:1.1rem; font-weight:900; line-height:1.2;
                 text-shadow:0 0 16px rgba(0,229,255,.4); }
  .hijri-date  {
    font-size:.72rem; color:var(--accent); font-weight:600;
    background:rgba(41,182,246,.1); border:1px solid var(--border);
    border-radius:20px; padding:2px 12px;
  }

  /* ── View states ── */
  /* On mobile: show list OR report, toggle with JS */
  #listView, #reportView { position:relative; z-index:1; }

  /* ── Teacher list ── */
  .list-header {
    padding: 14px 16px 8px;
    font-size:.7rem; font-weight:700; color:var(--muted);
    letter-spacing:.1em;
    border-bottom: 1px solid var(--border);
  }
  .teacher-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 14px;
  }
  .teacher-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--sub);
    font-family: 'Cairo', sans-serif;
    font-size: .85rem; font-weight: 700;
    padding: 14px 12px;
    cursor: pointer;
    text-align: center;
    transition: all .2s ease;
    display: flex; flex-direction:column; align-items:center; gap:6px;
    -webkit-user-select:none; user-select:none;
  }
  .teacher-btn:active {
    transform: scale(.96);
    background: var(--panel);
  }
  .btn-num {
    font-size:.65rem; font-weight:900; color:var(--muted);
    background:rgba(255,255,255,.07); border-radius:6px;
    width:20px; height:20px; display:grid; place-items:center;
  }
  .teacher-btn.active {
    background: linear-gradient(135deg, #1565C0, #0D47A1);
    color:#fff; border-color:var(--accent);
    box-shadow: 0 4px 16px rgba(21,101,192,.5);
  }
  .teacher-btn.active .btn-num { background:rgba(255,255,255,.2); color:#fff; }

  /* ── Report view ── */
  #reportView { display:none; }

  .back-bar {
    display:flex; align-items:center; gap:10px;
    padding:12px 16px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    cursor:pointer;
    -webkit-user-select:none; user-select:none;
  }
  .back-bar:active { background:var(--panel); }
  .back-icon { font-size:1.1rem; color:var(--accent); }
  .back-label { font-size:.85rem; font-weight:700; color:var(--sub); }

  .report-scroll { padding: 14px 14px 30px; display:flex; flex-direction:column; gap:14px; }

  /* report card */
  .report-card {
    background:var(--card); border:1px solid var(--border);
    border-radius:14px; overflow:hidden;
    animation:slide-in .28s ease;
  }
  @keyframes slide-in {
    from { opacity:0; transform:translateY(10px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .card-header {
    background:linear-gradient(135deg, #0D2B55, #1565C0);
    padding:16px;
  }
  .card-header-top {
    display:flex; justify-content:space-between; align-items:flex-start; gap:8px;
  }
  .card-header h3 { font-size:1.05rem; font-weight:900; color:#fff; }
  .card-header p  { font-size:.72rem; color:rgba(255,255,255,.6); margin-top:3px; line-height:1.6; }
  .card-badge {
    background:rgba(0,229,255,.15); border:1px solid var(--glow);
    border-radius:8px; padding:4px 10px;
    font-size:.68rem; color:var(--glow); font-weight:700;
    white-space:nowrap; flex-shrink:0;
  }

  .card-body { padding:14px; display:flex; flex-direction:column; gap:14px; }

  /* info grid */
  .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .info-item {
    background:var(--panel); border-radius:10px;
    padding:10px 12px; border:1px solid var(--border);
  }
  .info-label { font-size:.65rem; color:var(--muted); font-weight:600; margin-bottom:3px; }
  .info-value { font-size:.82rem; color:var(--text); font-weight:700; line-height:1.4; }
  .info-value.hl { color:var(--accent); }

  /* section title */
  .sec-title {
    font-size:.68rem; font-weight:700; color:var(--muted);
    letter-spacing:.1em;
    display:flex; align-items:center; gap:8px;
  }
  .sec-title::after { content:''; flex:1; height:1px; background:var(--border); }

  /* criteria */
  .criteria-list { display:flex; flex-direction:column; gap:12px; }
  .criterion { display:flex; flex-direction:column; gap:5px; }
  .crit-row { display:flex; justify-content:space-between; align-items:baseline; }
  .crit-name { font-size:.82rem; font-weight:600; color:var(--text); }
  .crit-pct  { font-size:.75rem; font-weight:700; color:var(--accent); direction:ltr; }
  .bar-track { height:7px; background:rgba(255,255,255,.06); border-radius:4px; overflow:hidden; }
  .bar-fill  {
    height:100%; border-radius:4px; width:0%;
    background:linear-gradient(90deg, var(--brand), var(--glow));
    transition:width 1s cubic-bezier(.4,0,.2,1);
    box-shadow:0 0 6px rgba(0,229,255,.4);
  }

  /* notes */
  .notes-box {
    background:var(--panel); border-radius:10px;
    border:1px solid var(--border);
    border-right:3px solid var(--accent);
    padding:12px 14px;
  }
  .notes-hdr  { font-size:.68rem; color:var(--accent); font-weight:700; margin-bottom:6px; }
  .notes-text { font-size:.82rem; color:var(--sub); line-height:1.9; }

  /* print btn */
  .print-btn {
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:linear-gradient(135deg,#1565C0,#0D47A1);
    color:#fff; border:none; border-radius:12px;
    padding:13px; font-family:'Cairo',sans-serif;
    font-size:.88rem; font-weight:700; cursor:pointer;
    box-shadow:0 4px 16px rgba(21,101,192,.4);
    width:100%;
    -webkit-user-select:none; user-select:none;
  }
  .print-btn:active { opacity:.85; transform:scale(.98); }

  /* ── Print ── */
  @media print {
    body { background:#fff; color:#000; }
    body::before { display:none; }
    .back-bar, .print-btn { display:none; }
    #listView { display:none !important; }
    #reportView { display:block !important; }
    .app-header { background:#1565C0 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .card-header { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .bar-fill { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }

  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-thumb { background:var(--muted); border-radius:2px; }
</style>
</head>
<body>

<!-- Header -->
<header class="app-header">

    notes:"تُركز على استخدام الساعة مع الطالبات ذوات الاحتياجات الخاصة وقد حققت نتائج إيجابية في تعزيز الانتباه. يستحق هذا التطبيق بحثاً متخصصاً." },
  { name:"بدريه العتيبي",  role:"قائدة مبادرات الصحة",          grade:"السادس الابتدائي", subject:"التربية الإسلامية",
    criteria:[{label:"توظيف الساعة في الدرس",score:92},{label:"تنشيط مهارات الطالبات",score:88},{label:"إدارة الوقت الرقمي",score:94},{label:"التفاعل والمشاركة",score:90},{label:"ربط التقنية بالمنهج",score:93}],

];

// Hijri
function toHijri(d) {
  const JD = Math.floor((14+Math.floor((d.getMonth()+1+9)/12))/4)
    -Math.floor((3*(Math.floor((d.getFullYear()+Math.floor((d.getMonth()+1+9)/12)-1)/100)+1))/4)
    +Math.floor(275*(d.getMonth()+1)/9)+d.getDate()+d.getFullYear()*365
    +Math.floor(d.getFullYear()/4)+1721027.5;
  let l=Math.floor(JD)-1948440+10632;
  const n=Math.floor((l-1)/10631);
  l=l-10631*n+354;
  const J=(Math.floor((10985-l)/5316))*(Math.floor((50*l)/17719))+(Math.floor(l/5670))*(Math.floor((43*l)/15238));
  l=l-(Math.floor((30-J)/15))*(Math.floor((17719*J)/50))-(Math.floor(J/16))*(Math.floor((15238*J)/43))+29;
  const mo=Math.floor((24*l)/709), dy=l-Math.floor((709*mo)/24), yr=30*n+J-30;
  const ms=['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
  return `${dy} ${ms[mo-1]} ${yr} هـ`;
}
document.getElementById('hijriDate').textContent = toHijri(new Date());

// Build grid
const grid = document.getElementById('teacherGrid');
teachers.forEach((t,i) => {
  const btn = document.createElement('button');
  btn.className = 'teacher-btn';
  btn.innerHTML = `<span class="btn-num">${i+1}</span>${t.name}`;
  btn.onclick = () => showReport(i, btn);
  grid.appendChild(btn);
});

let activeBtn = null;

function showReport(i, btn) {
  if (activeBtn) activeBtn.classList.remove('active');
  btn.classList.add('active');
  activeBtn = btn;

  const t = teachers[i];
  const avg = Math.round(t.criteria.reduce((s,c)=>s+c.score,0)/t.criteria.length);
  const rating = avg>=95?'ممتاز':avg>=85?'جيد جداً':avg>=75?'جيد':'مقبول';
  const hijri = toHijri(new Date());

  const crHTML = t.criteria.map(c=>`
    <div class="criterion">
      <div class="crit-row">
        <span class="crit-name">${c.label}</span>
        <span class="crit-pct">${c.score}%</span>
      </div>
      <div class="bar-track"><div class="bar-fill" data-t="${c.score}"></div></div>
    </div>`).join('');

  document.getElementById('reportScroll').innerHTML = `
    <div class="report-card">
      <div class="card-header">
        <div class="card-header-top">
          <div>
            <h3>${t.name}</h3>
            <p>${t.role}<br>${t.subject} — ${t.grade}</p>
          </div>
          <div class="card-badge">⌚ ساعة ذكية</div>
        </div>
      </div>
      <div class="card-body">
        <div class="info-grid">
          <div class="info-item">
            <div class="info-label">المدرسة</div>
            <div class="info-value">الابتدائية الثانية بالقاعدة الجوية</div>
          </div>
          <div class="info-item">
            <div class="info-label">التاريخ الهجري</div>
            <div class="info-value hl">${hijri}</div>
          </div>
          <div class="info-item">
            <div class="info-label">المادة</div>
            <div class="info-value">${t.subject}</div>
          </div>
          <div class="info-item">
            <div class="info-label">التقييم الإجمالي</div>
            <div class="info-value hl">${avg}% — ${rating}</div>
          </div>
        </div>
        <div class="sec-title">معايير التقييم</div>
        <div class="criteria-list">${crHTML}</div>
        <div class="sec-title">ملاحظات المشرفة</div>
        <div class="notes-box">
          <div class="notes-hdr">📋 ملاحظة مخصصة</div>
          <div class="notes-text">${t.notes}</div>
        </div>
        <button class="print-btn" onclick="window.print()">🖨️ طباعة التقرير</button>
      </div>
    </div>`;

  // switch view
  document.getElementById('listView').style.display = 'none';
  document.getElementById('reportView').style.display = 'block';
  window.scrollTo(0,0);

  // animate bars
  requestAnimationFrame(() => {
    document.querySelectorAll('.bar-fill').forEach(b => {
      setTimeout(() => { b.style.width = b.dataset.t + '%'; }, 80);
    });
  });
}

function goBack() {
  document.getElementById('reportView').style.display = 'none';
  document.getElementById('listView').style.display = 'block';
  window.scrollTo(0,0);
}
</script>
